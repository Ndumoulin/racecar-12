<!DOCTYPE html>
<html lang="fr-CA">

<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <!-- CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- JavaScript - Import Dependencies -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="js/jquery-3.3.1.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/virtualjoystick.js"></script>
    <script src="js/roslib.min.js"></script> <!-- rosbridge -->

    <title>GRO525 | Login</title>
</head>

<body>

    <!-- Main layout BEGIN-->
    <div class="container-fluid">
        <div class="login">
            <h4 class="login-title mt-3">Connexion au Racecar</h4>

            <form id="loginForm">
                <div class="form-group mb-3">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" class="form-control" id="username" placeholder="Entrez votre nom" required>
                </div>

                <div class="form-group mb-3">
                    <label for="ipAddress">Adresse IP</label>
                    <input type="text" class="form-control" id="ipAddress" placeholder="Ex: 192.168.0.10" required>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="connectBtn">Se connecter</button>
            </form>

            <div class="mt-3 text-center" id="statusMessage"></div>
        </div>
    </div>
    <!-- Main layout END-->

    <!-- vvv Use this file for your scripts vvv-->
    <script type="text/javascript" src="js/login.js"></script>
</body>

</html>
