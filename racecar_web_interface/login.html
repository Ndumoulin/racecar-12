<!DOCTYPE html>
<html lang="fr-CA">

<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <!-- CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/config.css">

    <!-- JavaScript - Import Dependencies -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="js/jquery-3.3.1.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/virtualjoystick.js"></script>
    <script src="js/roslib.min.js"></script> <!-- rosbridge -->

    <title>Racecar Login</title>
</head>

<body>

    <!-- Main layout BEGIN-->
     <div class="login-container">
        <h2>Racecar Connexion</h2>

        <!-- IMPORTANT: Restored form for JS -->
        <form id="loginForm">

            <div class="form-group">
                <label>Racecar Number</label>
                <!-- FIXED ID -->
                <input type="text" id="username" class="form-control" placeholder="12">
            </div>

            <div class="form-group">
                <label>Racecar IP Number</label>
                <!-- FIXED ID -->
                <input type="text" id="ipAddress" class="form-control" placeholder="192.168.x.x">
            </div>

            <!-- FIXED ID on button -->
            <button id="connectBtn" type="submit" class="btn btn-primary btn-block">Connect</button>

        </form>

        <!-- Connection status area -->
        <div id="statusMessage" class="status"></div>
    </div>
    <!-- Main layout END-->

    <!-- vvv Use this file for your scripts vvv-->
    <script type="text/javascript" src="js/login.js"></script>
</body>

</html>
