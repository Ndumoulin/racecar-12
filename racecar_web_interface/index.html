<!DOCTYPE html>
<html lang="fr-CA">

<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <!-- CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- JavaScript - Import Dependencies -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="js/jquery-3.3.1.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/virtualjoystick.js"></script>
    <script src="js/roslib.min.js"></script> <!-- rosbridge -->

    <title>GRO525 | Laboratoire</title>
</head>

<body>

    <!-- Collapsible Menu BEGIN -->
    <div class="collapse bg-dark" id="navbarToggleExternalContent">
        <div class="p-4 text-white">
            <h4>Racecar Configuration</h4>

            <!-- IP Configuration -->
            <div class="mt-3">
                <label for="ipAddressInput">Racecar IP:</label>
                <input type="text" id="ipAddressInput" class="form-control form-control-sm config-input" placeholder="192.168.x.x">
                <button class="btn btn-primary btn-sm mt-2" id="connectButton" onclick="connectROS()">Connect</button>

            </div>
        </div>
    </div>
    <!-- Collapsible Menu END -->

    <!-- Navbar BEGIN -->
    <nav class="navbar navbar-dark bg-dark">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarToggleExternalContent">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>
    <!-- Navbar END -->

    <!-- Main layout BEGIN -->
    <div class="row text-center">
        <!-- Control Section -->
        <div class="col-4 section-control border">
            <h2>Control</h2>
            <button class="start-button">Start</button>
            <button class="stop-button">Stop</button>
        </div>

        <!-- Status Section -->
        <div class="col-4 section-status border">
            <h2>Status</h2>
            <div class="status-light-container">
                <div id="go-light" class="light"></div>
                <span>GO</span>
            </div>
            <div class="status-light-container">
                <div id="stop-light" class="light"></div>
                <span>STOP</span>
            </div>
        </div>

        <!-- Camera Feed Section -->
        <div class="col-4 section-camera border">
            <h2>Camera Feed</h2>
            <div class="Video">

                <img src="http://localhost:8080/stream?topic=/racecar/camera" alt="Camera Feed">
            </div>
        </div>
    </div>
    <!-- Main layout END -->

    <!-- Main JS -->
    <script type="text/javascript" src="js/main.js"></script>

</body>

</html>
