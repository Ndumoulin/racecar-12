<!DOCTYPE html>
<html lang="fr-CA">

<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <!-- CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- JavaScript - Import Dependencies -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="js/jquery-3.3.1.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/virtualjoystick.js"></script>
    <script src="js/roslib.min.js"></script> <!-- rosbridge -->

    <title>GRO525 | Laboratoire</title>
</head>

<body>
    <!-- Menu BEGIN-->
    <div class="collapse" id="navbarToggleExternalContent">
        <div class="bg-dark p-4">
            <h6 class="text-white h4">Configuration</h6>
        </div>
    </div>

    <nav class="navbar navbar-dark bg-dark">
        <div>
            <button class="navbar-toggler" type="button" data-toggle="collapse"
                data-target="#navbarToggleExternalContent">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>
    <!-- Menu END-->

    <!-- Main layout BEGIN-->


    <div class="container-fluid">

        <!-- Main layout END-->
        <div class="row">
            <div class="col-md-6">
                <div class="card fixed-card">
                    <div class="card-block">
                        <h1 class="card-header">Status</h1>
                        <div class="scrollable-content" id="scrollable-content">
                            <p class="card-text" id="status"></p>
                        </div>
                    </div>
                </div>
                <button class="btn btn-warning" id="effacer" type="reset">Effacer</button>

                <div class="row"></div>
                <h2>Contrôle de la voiture</h2>
                <button class="btn btn-success" id="avancer" type="submit">Avancer</button>
                <button class="btn btn-danger" id="arreter" type="submit">Arrêter</button>
            </div>
            <div class="col-md-6">
                <div class="card fixed-card">
                    <div class="card-block">
                        <h1 class="card-header">Caméra</h1>
                        <img class="card-img-top" id="camera" src="http://192.168.1.1:8080/stream" alt="Camera stream">
                    </div>
            </div>
        </div>
    </div>




    <!-- vvv Use this file for your scripts vvv-->
    <script type="text/javascript" src="js/main.js"></script>
</body>

</html>
