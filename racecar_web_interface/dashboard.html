<!DOCTYPE html>
<html lang="fr-CA">

<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <!-- CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- JavaScript - Import Dependencies -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="js/jquery-3.3.1.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/virtualjoystick.js"></script>
    <script src="js/roslib.min.js"></script> <!-- rosbridge -->

    <title>Racecar Dashboard</title>
</head>

<body>

    <!-- Header -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="#" id="navbar__logo">
      <img src="images/ferrari_logo.png" alt="Racecar Logo">
    </a>
            <span class="text-light" id="userInfo"></span>
            <span class="badge bg-secondary ms-3" id="connectionStatus">Déconnecté</span>
        </div>
    </nav>

    <!-- Main layout BEGIN-->
    <div class="container-fluid">
        <div class="row">
            <!-- Colonne de gauche : Status et Contrôle -->
            <div class="col-md-6 order-2 order-md-1">
                <label for="speed_range">Speed</label>

                <div class="control-container" style="width: 100%;">
                    <!-- Speed range slider -->
                    <input type="range" id="speed_range" name="volume" min="0" max="100"
                        style="width: 100%; margin-top: 5px;">

                    <!-- Arrow button grid -->
                    <div class="arrow-grid"
                        style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px;">
                        <button class="arrow-btn" id="arrow-up-left">↖</button>
                        <button class="arrow-btn" id="arrow-up">↑</button>
                        <button class="arrow-btn" id="arrow-up-right">↗</button>
                        <button class="arrow-btn" id="arrow-down-left">↙</button>
                        <button class="arrow-btn" id="arrow-down">↓</button>
                        <button class="arrow-btn" id="arrow-down-right">↘</button>
                    </div>

                    <button id="stop-button" style="width: 100%; margin-top: 20px; padding: 15px 0; font-size: 20px;
                       font-weight: bold; color: white; background-color: #d9534f;
                       border: none; border-radius: 8px; cursor: pointer;
                       transition: background-color 0.2s;">
                        STOP
                    </button>
                </div>
            </div>

            <!-- Colonne de droite : Flux vidéo -->
            <div class="col-md-6 order-1 order-md-2">
                <h1 class="text-center">Caméra</h1>
                <div class="video-container">

                    <img id="videoStream" class="w-100" src="http://localhost:8080/stream?topic=/racecar/camera"
                        alt="Flux vidéo ROS">
                </div>
            </div>
        </div>
    </div>
    <!-- Main layout END-->

    <!-- Scripts -->
    <script type="text/javascript" src="js/dashboard.js"></script>
</body>

</html>
