<!DOCTYPE html>
<html lang="fr-CA">

<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">

    <!-- CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- JavaScript - Import Dependencies -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="js/jquery-3.3.1.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/virtualjoystick.js"></script>
    <script src="js/roslib.min.js"></script> <!-- rosbridge -->

    <title>GRO525 | Dashboard</title>
</head>

<body>

    <!-- Header -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">DASHBOARD</span>
            <span class="text-light" id="userInfo"></span>
            <span class="badge bg-secondary ms-3" id="connectionStatus">Déconnecté</span>
        </div>
    </nav>

    <!-- Main layout BEGIN-->
    <div class="container-fluid">
        <div class="row">
            <!-- Colonne de gauche : Status et Contrôle -->
            <div class="col-md-6">
                
            </div>

            <!-- Colonne de droite : Flux vidéo -->
            <div class="col-md-6">
                <h1 class="text-left">Caméra</h1>
                <div class="video-container">

                    <img id="videoStream" class="w-100" src="http://localhost:8080/stream?topic=/racecar/camera"
                        alt="Flux vidéo ROS">
                </div>
            </div>
        </div>
    </div>
    <!-- Main layout END-->

    <!-- Scripts -->
    <script type="text/javascript" src="js/dashboard.js"></script>
</body>

</html>
